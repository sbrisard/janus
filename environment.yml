# Conda environment for the development of Janus.
#
#     conda env create -f environment.yml
#     conda activate janus
#
# Janus itself is not installed by this file: run
#
#     pip install --no-build-isolation -e .
#
# (see sphinx/installation.rst; within this environment, setup.cfg is not
# needed).
name: janus
channels:
  - conda-forge
dependencies:
  - python=3.14
  - pip
  # Build
  - setuptools
  - cython
  # The nompi builds avoid pulling an MPI implementation from conda-forge.
  - fftw=*=nompi_*
  # Run
  - numpy
  # Tests
  - pytest
  # Documentation
  - sphinx
